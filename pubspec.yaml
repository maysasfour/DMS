name: disaster_management_app
description: "A Flutter Disaster Management System app connected to a Spring Boot REST API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  go_router: ^13.2.5
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.20.0
  permission_handler: ^11.3.1
  geolocator: ^11.0.0
  file_picker: ^8.0.7
  flutter_local_notifications: ^17.2.2
  badges: ^3.1.2
  shimmer: ^3.0.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  connectivity_plus: ^6.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.0.0
  share_plus: ^12.0.2
  record: ^6.0.0
  path_provider: ^2.1.3
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
