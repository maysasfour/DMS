# ════════════════════════════════════════════════════════════════
#  docker-compose.prod.yml — production stack
#  Usage:
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: dms-postgres
    environment:
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private environment file}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - dms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # DB is NOT exposed publicly — only reachable inside Docker network

  # ── PGAdmin (optional, close port in firewall for security) ────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@dms.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in your private environment file}
    ports:
      - "127.0.0.1:5050:80"        # access via http://SERVER_IP:5050 — block in UFW after setup
    depends_on:
      - db
    restart: unless-stopped

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms-backend
    environment:
      DB_HOST:              db
      DB_PORT:              5432
      DB_NAME:              ${DB_NAME}
      DB_USERNAME:          ${DB_USERNAME}
      DB_PASSWORD:          ${DB_PASSWORD:?Set DB_PASSWORD in your private environment file}
      JWT_SECRET:           ${JWT_SECRET:?Set JWT_SECRET in your private environment file}
      JWT_EXPIRATION:       ${JWT_EXPIRATION:-86400000}
      FRONTEND_ORIGIN:      ${FRONTEND_ORIGIN}
      UPLOAD_DIR:           /app/uploads/
      SEED_ADMIN_HASH: ${SEED_ADMIN_HASH:-!DISABLED!}
      SEED_CITIZEN_HASH: ${SEED_CITIZEN_HASH:-!DISABLED!}
      SEED_LEGACY_ADMIN_HASH: ${SEED_LEGACY_ADMIN_HASH:-!DISABLED!}
      SEED_LEGACY_CITIZEN_HASH: ${SEED_LEGACY_CITIZEN_HASH:-!DISABLED!}
      SEED_PERSONAL_ADMIN_HASH: ${SEED_PERSONAL_ADMIN_HASH:-!DISABLED!}
      SEED_PERSONAL_ADMIN_EMAIL: ${SEED_PERSONAL_ADMIN_EMAIL:-disabled@example.invalid}
      SERVER_PORT:          9090
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID:      ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET:  ${FACEBOOK_APP_SECRET}
      SWAGGER_ENABLED:      false
      SPRING_PROFILES_ACTIVE: production
    volumes:
      - dms_uploads:/app/uploads
      - dms_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    # Backend is NOT exposed publicly — nginx proxies /api/ to it

  # ── AI Agent (Express / Gemini) ─────────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: dms-ai-agent
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BACKEND_URL: http://backend:9090
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PORT: 3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # AI agent is NOT exposed publicly — nginx proxies /ai/ to it

  # ── Nginx + React SPA ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_FACEBOOK_APP_ID:  ${FACEBOOK_APP_ID}
        VITE_AI_AGENT_URL:     https://${DOMAIN:-dms-maysas.duckdns.org}/ai
    container_name: dms-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.ssl:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dms_pgdata:
  dms_uploads:
  dms_logs:
