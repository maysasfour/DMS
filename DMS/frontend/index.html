<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Disaster Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="root" translate="no"></div>
    <!-- Apply theme before React mounts to prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        var lang = localStorage.getItem('language') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      })();
    </script>
    <script>
      window.addEventListener('error', function(e) {
        var d = document.getElementById('root');
        if (d && (!d.innerHTML || d.innerHTML.trim() === '')) {
          d.innerHTML = '<div style="padding:32px;font-family:monospace;background:#0b1120;color:#f1f5f9;min-height:100vh"><h2 style="color:#E63946">JS Error (check browser console)</h2><pre style="color:#fca5a5;white-space:pre-wrap">' + (e.message || e) + '\n\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[Unhandled Promise]', e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Facebook SDK placeholder — initialized by React when VITE_FACEBOOK_APP_ID is set -->
  </body>
</html>
