spring.application.name=DMS

# Datasource (H2 dev default; override via env for PostgreSQL/MySQL)
spring.datasource.url=jdbc:h2:mem:dmsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL init data
spring.sql.init.mode=always

# Thymeleaf
spring.thymeleaf.cache=false

# MVC
spring.mvc.hiddenmethod.filter.enabled=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# File uploads
app.upload-dir=uploads
app.allowed-file-types=image/jpeg,image/png,image/gif,video/mp4,video/quicktime
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

server.port=8090

# Reverse proxy support (nginx / DuckDNS HTTPS)
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
