<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A0A1E"/>
      <stop offset="100%" stop-color="#060A14"/>
    </radialGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B0020"/>
      <stop offset="50%" stop-color="#CC0030"/>
      <stop offset="100%" stop-color="#FF003C"/>
    </linearGradient>

    <!-- Shield inner glow gradient -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A1E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D0520" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Neon red glow filter -->
    <filter id="neonRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong outer glow -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for details -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White glow for bolt -->
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for rounded square background -->
    <clipPath id="roundedBg">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern overlay -->
  <g clip-path="url(#roundedBg)" opacity="0.06">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#FF003C" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#FF003C" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#FF003C" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#FF003C" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#FF003C" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#FF003C" stroke-width="1"/>
  </g>

  <!-- Outer red halo (glow ring behind shield) -->
  <ellipse cx="256" cy="268" rx="148" ry="158" fill="#FF003C" opacity="0.12" filter="url(#outerGlow)"/>

  <!-- Shield shape — outer glow layer -->
  <path d="M256 82 L380 126 L380 262 C380 330 330 390 256 422 C182 390 132 330 132 262 L132 126 Z"
        fill="#FF003C" opacity="0.25" filter="url(#outerGlow)"/>

  <!-- Shield body -->
  <path d="M256 88 L374 130 L374 262 C374 326 326 384 256 416 C186 384 138 326 138 262 L138 130 Z"
        fill="url(#shieldGrad)" filter="url(#neonRed)"/>

  <!-- Shield inner dark face -->
  <path d="M256 106 L358 143 L358 262 C358 316 316 366 256 394 C196 366 154 316 154 262 L154 143 Z"
        fill="url(#shieldInner)"/>

  <!-- Shield border highlight (top-left rim) -->
  <path d="M256 106 L358 143 L358 262 C358 316 316 366 256 394 C196 366 154 316 154 262 L154 143 Z"
        fill="none" stroke="#FF003C" stroke-width="2.5" opacity="0.8"/>

  <!-- Corner accent dots -->
  <circle cx="174" cy="158" r="4" fill="#FF003C" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="338" cy="158" r="4" fill="#FF003C" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Horizontal scan line inside shield -->
  <line x1="170" y1="220" x2="342" y2="220" stroke="#FF003C" stroke-width="1" opacity="0.3"/>
  <line x1="170" y1="310" x2="342" y2="310" stroke="#FF003C" stroke-width="1" opacity="0.2"/>

  <!-- Lightning bolt / crisis symbol — glow layer -->
  <path d="M278 148 L226 268 L258 268 L234 370 L298 238 L264 238 L290 148 Z"
        fill="#FF003C" opacity="0.5" filter="url(#boltGlow)"/>

  <!-- Lightning bolt — main body -->
  <path d="M278 148 L226 268 L258 268 L234 370 L298 238 L264 238 L290 148 Z"
        fill="white" filter="url(#boltGlow)"/>

  <!-- Lightning bolt — inner white core -->
  <path d="M272 162 L232 264 L256 264 L238 354 L288 244 L262 244 L280 162 Z"
        fill="white" opacity="0.95"/>

  <!-- Red tint on bolt middle -->
  <path d="M264 220 L244 264 L256 264 L248 298 L276 240 L262 240 Z"
        fill="#FF6080" opacity="0.4"/>

  <!-- Top circuit lines decorations -->
  <g opacity="0.35" filter="url(#softGlow)">
    <line x1="178" y1="172" x2="198" y2="172" stroke="#FF003C" stroke-width="2"/>
    <line x1="198" y1="172" x2="198" y2="180" stroke="#FF003C" stroke-width="2"/>
    <line x1="334" y1="172" x2="314" y2="172" stroke="#FF003C" stroke-width="2"/>
    <line x1="314" y1="172" x2="314" y2="180" stroke="#FF003C" stroke-width="2"/>
  </g>

  <!-- "DMS" text at bottom of shield -->
  <text x="256" y="362" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="38" fill="white" text-anchor="middle" letter-spacing="6"
        opacity="0.9" filter="url(#softGlow)">DMS</text>

  <!-- Red underline under DMS -->
  <rect x="204" y="368" width="104" height="3" rx="1.5" fill="#FF003C" opacity="0.8"/>

  <!-- Bottom glow line -->
  <line x1="180" y1="410" x2="332" y2="410" stroke="#FF003C" stroke-width="1.5" opacity="0.3"/>
</svg>
